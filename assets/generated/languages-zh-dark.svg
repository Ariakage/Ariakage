<title id="title">Ariakage 公开仓库的代码语言分布</title><desc id="description">HTML: 29.9%; Python: 24.8%; Swift: 11.2%; CSS: 9.6%; 其他: 24.5%</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif}.bg{fill:#101b2a}.border{fill:#253b52}.text{fill:#e7f2ff}.muted{fill:#a0b5cc}.blue{fill:#82caff}.pink{fill:#f49bb2}.grid{fill:#24374b}.fill{fill:#193a55}
.signal{animation:breathe 3.6s ease-in-out infinite}@keyframes breathe{50%{opacity:.3}}
.trace{stroke-dasharray:28 972;animation:travel 10s linear infinite}@keyframes travel{to{stroke-dashoffset:-1000}}
