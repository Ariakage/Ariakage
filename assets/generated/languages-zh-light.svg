<title id="title">Ariakage 公开仓库的代码语言分布</title><desc id="description">HTML: 29.0%; Python: 24.2%; Swift: 10.8%; CSS: 9.3%; 其他: 26.6%</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Helvetica,Arial,sans-serif}.bg{fill:#f6faff}.border{fill:#dce8f4}.text{fill:#233954}.muted{fill:#5d728a}.blue{fill:#2889ce}.pink{fill:#d96280}.grid{fill:#e3edf7}.fill{fill:#d4eaff}
.signal{animation:breathe 3.6s ease-in-out infinite}@keyframes breathe{50%{opacity:.3}}
.trace{stroke-dasharray:28 972;animation:travel 10s linear infinite}@keyframes travel{to{stroke-dashoffset:-1000}}
